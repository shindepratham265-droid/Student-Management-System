{% extends "base.html" %}
{% block title %}Add Student — Student Management System{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h1 class="page-header">
            <i class="bi bi-person-plus me-2"></i>Add New Student
        </h1>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="form-card">
            <form method="POST" action="{{ url_for('add_student') }}" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- Student ID -->
                <div class="mb-3">
                    <label for="student_id" class="form-label">
                        Student ID <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" id="student_id"
                           name="student_id" placeholder="e.g. STU001"
                           value="{{ request.form.get('student_id', '') }}" required>
                    <div class="form-text">Must be unique for each student.</div>
                </div>

                <!-- Full Name -->
                <div class="mb-3">
                    <label for="full_name" class="form-label">
                        Full Name <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" id="full_name"
                           name="full_name" placeholder="e.g. John Doe"
                           value="{{ request.form.get('full_name', '') }}" required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email Address <span class="text-danger">*</span>
                    </label>
                    <input type="email" class="form-control" id="email"
                           name="email" placeholder="e.g. john@example.com"
                           value="{{ request.form.get('email', '') }}" required>
                </div>

                <!-- Department -->
                <div class="mb-3">
                    <label for="department" class="form-label">
                        Department <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" id="department"
                           name="department" placeholder="e.g. Computer Science"
                           value="{{ request.form.get('department', '') }}" required>
                </div>

                <!-- Academic Year -->
                <div class="mb-3">
                    <label for="academic_year" class="form-label">
                        Academic Year <span class="text-danger">*</span>
                    </label>
                    <select class="form-select" id="academic_year" name="academic_year" required>
                        <option value="" disabled
                            {{ 'selected' if not request.form.get('academic_year') }}>
                            Select Academic Year
                        </option>
                        {% for year in ['1st Year', '2nd Year', '3rd Year', '4th Year'] %}
                            <option value="{{ year }}"
                                {{ 'selected' if request.form.get('academic_year') == year }}>
                                {{ year }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('view_students') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Add Student
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
