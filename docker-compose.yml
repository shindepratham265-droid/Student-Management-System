services:
  # ── 1. Flask Student Management Application ───────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-management-system:latest
    container_name: student-management-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=dev-secret-key-for-college-demo
      - FIREBASE_CREDENTIALS_PATH=/app/studentmanagementsystem-f3040-firebase-adminsdk-fbsvc-0867d41342.json
    networks:
      - devops-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── 2. Prometheus Monitoring ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: devops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - devops-network
    depends_on:
      - web

  # ── 3. Prometheus Alertmanager ─────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: devops-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - devops-network

  # ── 4. Grafana Dashboards ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: devops-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - devops-network
    depends_on:
      - prometheus

networks:
  devops-network:
    driver: bridge
